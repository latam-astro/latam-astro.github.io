<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LARIM 2026 | Astronomical Community</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#203044;font:16px/1.65 system-ui,sans-serif}main{max-width:960px;margin:auto;padding:48px 24px}header{text-align:center;margin-bottom:36px}.eyebrow{font-size:.8rem;letter-spacing:.19em;font-weight:700;color:#526478}h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.12;margin:20px auto;max-width:760px}nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:24px 0}button{font:inherit;cursor:pointer;border:1px solid #cbd5df;border-radius:30px;padding:8px 18px;background:white;color:#203044}button[aria-pressed=true]{background:#203044;color:white;border-color:#203044}.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px}article{background:white;border:1px solid #dce3ea;border-top:5px solid var(--accent);border-radius:14px;padding:28px;display:flex;flex-direction:column}article:first-child{--accent:#234e70}article:last-child{--accent:#28786c}h2{color:var(--accent);line-height:1.2;margin:12px 0}small{font-weight:700;letter-spacing:.07em;color:var(--accent)}a{display:block;margin-top:auto;padding:12px 16px;background:var(--accent);color:white;text-align:center;text-decoration:none;border-radius:8px;font-weight:600}a[aria-disabled=true]{background:#e8edf2;color:#526478;cursor:not-allowed}button:focus-visible,a:focus-visible{outline:3px solid #b66a20;outline-offset:4px}footer{text-align:center;color:#526478;font-size:.9rem;margin-top:28px}@media(max-width:650px){.cards{grid-template-columns:1fr}main{padding:30px 18px}}</style></head><body><main><header><div class="eyebrow">LARIM 2026</div><nav aria-label="Language"><button data-lang="es" lang="es">Español</button><button data-lang="pt" lang="pt">Português</button><button data-lang="en" lang="en">English</button></nav><h1 id="title"></h1><p id="intro"></p></header><section class="cards"><article><small id="tag1"></small><h2 id="h1"></h2><p id="p1"></p><a id="a1" target="_blank" rel="noopener noreferrer"></a></article><article><small id="tag2"></s const copy={en:['Latin American astronomical community','Two complementary initiatives to better understand and connect our community.','ANONYMOUS','Survey on research challenges','Share your experiences and challenges. Responses are intended for statistical analysis, without identifying individual participants.','Answer the survey','PUBLIC PROFILE','Community database','Provide identifiable information and professional profile details to help build a public platform promoting visibility, networking and collaboration.','Create your profile','Participation in the two initiatives is voluntary and independent.','Coming soon'],pt:['Comunidade astronômica latino-americana','Duas iniciativas complementares para conhecer melhor e conectar nossa comunidade.','ANÔNIMA','Pesquisa sobre os desafios da pesquisa científica','Compartilhe suas experiências e desafios. As respostas serão utilizadas para análises estatísticas, sem identificar individualmente os participantes.','Responder à pesquisa','PERFIL PÚBLICO','Banco de dados da comunidade','Forneça informações de identificação e de perfil profissional para ajudar a construir uma plataforma pública que promova a visibilidade, a integração e a colaboração.','Criar meu perfil','A participação nas duas iniciativas é voluntária e independente.','Em breve'],es:['Comunidad astronómica latinoamericana','Dos iniciativas complementarias para conocer mejor y conectar a nuestra comunidad.','ANÓNIMA','Encuesta sobre los desafíos de la investigación científica','Comparte tus experiencias y desafíos. Las respuestas se utilizarán para análisis estadísticos, sin identificar individualmente a los participantes.','Responder la encuesta','PERFIL PÚBLICO','Base de datos de la comunidad','Proporciona información de identificación y del perfil profesional para contribuir a una plataforma pública que promueva la visibilidad, la integración y la colaboración.','Crear mi perfil','La participación en las dos iniciativas es voluntaria e independiente.','Próximamente']};
function render(lang){document.documentElement.lang=lang;const c=copy[lang];['title','intro','tag1','h1','p1','a1','tag2','h2','p2','a2','footer'].forEach((id,i)=>document.getElementById(id).textContent=c[i]);document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));['a1','a2'].forEach((id,i)=>{const a=document.getElementById(id),url=links[lang][i];if(url){a.href=url;a.removeAttribute('aria-disabled');a.removeAttribute('title')}else{a.removeAttribute('href');a.setAttribute('aria-disabled','true');a.title=c[11];a.textContent=c[11]}})}document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>render(b.dataset.lang)));const requested=new URLSearchParams(location.search).get('lang');render(Object.hasOwn(copy,requested)?requested:'es');</script></body></html>
